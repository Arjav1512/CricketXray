# Cricket X-Ray theme, built from the design-system tokens:
#   bg #0A0A0A · surface #141414 · surface-raised #1E1E1E · border #292929
#   fg #F5F5F3 · fg-muted #A3A3A3 · fg-subtle #707070
#   accent #F2693A (orange) · code-green #59D08A · code-violet #A78BFA
# Fonts use the local system stack (no remote font downloads).
# The same hex values are mirrored in charts.py and in the small CSS block in app.py.

[theme]
base = "dark"
primaryColor = "#F2693A"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#141414"
textColor = "#F5F5F3"
linkColor = "#F5F5F3"
linkUnderline = true
borderColor = "#292929"
showWidgetBorder = true
showSidebarBorder = true

font = "-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
codeFont = "'SF Mono', Menlo, Consolas, monospace"
codeFontSize = "0.8rem"
codeBackgroundColor = "#141414"
codeTextColor = "#A3A3A3"
baseFontSize = 15
headingFontSizes = ["2.6rem", "1.6rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [500, 500, 500, 500, 500, 500]
metricValueFontSize = "1.9rem"
metricValueFontWeight = 500

baseRadius = "0.75rem"
buttonRadius = "full"

# Named colours, also used for cluster badges (see charts.CLUSTER_PALETTE).
orangeColor = "#F2693A"
greenColor = "#59D08A"
violetColor = "#A78BFA"
yellowColor = "#F8B544"
blueColor = "#6CB6F5"
redColor = "#EF5B5B"
grayColor = "#A3A3A3"

chartCategoricalColors = ["#F2693A", "#59D08A", "#A78BFA", "#F8B544", "#6CB6F5", "#EF5B5B", "#EDEDE8", "#8A8A8A"]
dataframeHeaderBackgroundColor = "#141414"
dataframeHeaderTextColor = "#A3A3A3"
dataframeBorderColor = "#292929"

[theme.sidebar]
backgroundColor = "#0F0F0F"
secondaryBackgroundColor = "#141414"

[browser]
gatherUsageStats = false
